<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>스파르카노이드: 은하계 벽돌깨기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: #060411;
            color: #ffffff;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arcade-font {
            font-family: 'Orbitron', monospace;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 960px;
            aspect-ratio: 9 / 16;
            box-shadow: 0 0 50px rgba(124, 58, 237, 0.35), 0 0 100px rgba(6, 182, 212, 0.2);
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #170d36 0%, #080518 70%, #03020a 100%);
            border-radius: 0;
        }

        @media (min-width: 640px) {
            #game-wrapper {
                border-radius: 28px;
                border: 2px solid rgba(139, 92, 246, 0.4);
                height: 94vh;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 펄스 및 네온 텍스트 효과 */
        .neon-glow-pink {
            text-shadow: 0 0 10px #f43f5e, 0 0 20px #e11d48, 0 0 40px #be123c;
        }
        .neon-glow-cyan {
            text-shadow: 0 0 10px #06b6d4, 0 0 20px #0891b2, 0 0 35px #0e7490;
        }
        .neon-glow-gold {
            text-shadow: 0 0 10px #f59e0b, 0 0 25px #d97706;
        }

        /* 컨트롤 구역 인디케이터 */
        .touch-zone-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            pointer-events: none;
            border-top: 1px dashed rgba(139, 92, 246, 0.25);
            background: linear-gradient(to top, rgba(139, 92, 246, 0.07), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(167, 139, 250, 0.4);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .hud-glass {
            background: rgba(15, 10, 36, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .btn-arcade {
            position: relative;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #3b82f6 100%);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            transition: all 0.15s ease-out;
        }
        .btn-arcade:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        /* 시간 왜곡 필터 화면 효과 */
        .time-warp-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 80px rgba(56, 189, 248, 0.5);
            animation: pulse-warp 2s infinite ease-in-out;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .time-warp-active {
            opacity: 1;
        }
        @keyframes pulse-warp {
            0%, 100% { filter: hue-rotate(0deg) contrast(1.1); }
            50% { filter: hue-rotate(45deg) contrast(1.3); }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- 메인 렌더링 캔버스 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 시간 왜곡 쉐이더 느낌 오버레이 -->
        <div id="timeWarpEffect" class="time-warp-overlay"></div>

        <!-- 터치 조작 영역 가이드 라인 -->
        <div class="touch-zone-indicator">
            <span>⇄ 터치하여 패들 이동 (슬라이드 조작) ⇄</span>
        </div>

        <header class="absolute top-0 left-0 right-0 p-3.5 flex justify-between items-start pointer-events-none z-10">
            <!-- 좌측: 점수 & 콤보 -->
            <div class="flex flex-col gap-1">
                <div class="hud-glass px-3.5 py-1.5 rounded-xl shadow-lg flex items-baseline gap-2">
                    <span class="text-xs text-purple-300 font-semibold tracking-wider">SCORE</span>
                    <span id="scoreDisplay" class="arcade-font text-xl font-bold text-white tracking-tight">000000</span>
                </div>
                <div id="comboContainer" class="hud-glass px-2.5 py-0.5 rounded-lg opacity-0 transition-opacity duration-200 self-start flex items-center gap-1 border-pink-500/40">
                    <span class="text-[10px] text-pink-400 font-bold">COMBO</span>
                    <span id="comboDisplay" class="arcade-font text-xs font-black text-pink-300 neon-glow-pink">x2</span>
                </div>
            </div>

            <!-- 우측: 라이프 & 일시정지 버튼 -->
            <div class="flex items-center gap-2">
                <!-- 라이프 하트 -->
                <div class="hud-glass px-3 py-1.5 rounded-xl flex items-center gap-1.5">
                    <span class="text-xs text-cyan-300 font-bold">SHIPS</span>
                    <div id="livesContainer" class="flex gap-1 text-cyan-400 text-sm">
                        <!-- 생명 아이콘이 JS로 렌더링됨 -->
                    </div>
                </div>

                <!-- 오디오 토글 버튼 -->
                <button id="audioToggleBtn" class="hud-glass p-2.5 rounded-xl text-white/90 hover:text-white pointer-events-auto active:scale-95 transition-all flex items-center justify-center w-11 h-11" title="소리 켜기/끄기">
                    <svg id="audioIconOn" class="w-5 h-5 text-cyan-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.829 1 1 0 010-1.414z"/>
                    </svg>
                    <svg id="audioIconOff" class="w-5 h-5 text-gray-400 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM12.293 7.293a1 1 0 011.414 0L15 8.586l1.293-1.293a1 1 0 111.414 1.414L16.414 10l1.293 1.293a1 1 0 01-1.414 1.414L15 11.414l-1.293 1.293a1 1 0 01-1.414-1.414L13.586 10l-1.293-1.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>

                <!-- 일시정지 버튼 (최소 44x44px 터치 구역 보장) -->
                <button id="pauseBtn" class="hud-glass p-2.5 rounded-xl text-white/90 hover:text-white pointer-events-auto active:scale-95 transition-all flex items-center justify-center w-11 h-11" title="일시정지">
                    <svg class="w-5 h-5 text-purple-300" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 활성 버프/파워업 상태 타이머 인디케이터 -->
        <div id="powerupBarContainer" class="absolute top-16 left-3.5 right-3.5 flex flex-col gap-1 pointer-events-none z-10">
            <!-- 자바스크립트로 활성화된 파워업 막대 렌더링 -->
        </div>

        <!-- 시작 / 발사 대기 오버레이 (엄지 조작 최적화) -->
        <div id="startOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-20 cursor-pointer">
            <div class="text-center space-y-3">
                <div class="inline-block px-3 py-1 rounded-full bg-violet-900/50 border border-violet-500/40 text-violet-300 text-xs font-bold uppercase tracking-widest mb-1">
                    Galactic Arcade Edition
                </div>
                <h1 class="arcade-font text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300 drop-shadow-[0_0_15px_rgba(236,72,153,0.8)]">
                    SPARKANOID
                </h1>
                <p class="text-xs text-purple-200/80">은하계 벽돌깨기</p>
                
                <div class="pt-8">
                    <button class="btn-arcade w-64 py-4 rounded-2xl arcade-font text-base font-black tracking-widest text-white shadow-2xl flex items-center justify-center gap-2 mx-auto">
                        <span>화면 탭하여 시작</span>
                        <span class="inline-block animate-pulse">▶</span>
                    </button>
                </div>
                <p class="text-[11px] text-gray-400 pt-2">화면 하단을 손가락으로 좌우 드래그하여 패들을 조종하세요</p>
            </div>
        </div>

        <!-- 게임 일시정지 오버레이 -->
        <div id="pauseOverlay" class="absolute inset-0 bg-black/75 backdrop-blur-md flex-col items-center justify-center p-6 z-20 hidden">
            <div class="text-center space-y-5 hud-glass p-8 rounded-3xl border border-purple-500/30 max-w-xs w-full shadow-2xl">
                <h2 class="arcade-font text-2xl font-black text-cyan-300 neon-glow-cyan tracking-wider">GAME PAUSED</h2>
                <p class="text-sm text-purple-200">항법 장치가 잠시 정지되었습니다.</p>
                <div class="flex flex-col gap-3 pt-2">
                    <button id="resumeBtn" class="btn-arcade py-3.5 rounded-xl font-bold text-white text-sm shadow-lg">
                        계속 진행하기
                    </button>
                    <button id="restartFromPauseBtn" class="hud-glass py-3.5 rounded-xl font-bold text-gray-300 hover:text-white text-sm">
                        처음부터 재도전
                    </button>
                </div>
            </div>
        </div>

        <!-- 게임 오버 / 클리어 엔딩 오버레이 -->
        <div id="resultOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-md flex-col items-center justify-center p-6 z-20 hidden">
            <div class="text-center space-y-4 hud-glass p-8 rounded-3xl border border-pink-500/30 max-w-xs w-full shadow-2xl">
                <div id="resultBadge" class="text-xs font-bold uppercase tracking-widest text-pink-400">MISSION TERMINATED</div>
                <h2 id="resultTitle" class="arcade-font text-3xl font-black tracking-wider text-pink-400 neon-glow-pink">GAME OVER</h2>
                
                <div class="bg-purple-950/40 rounded-2xl p-4 border border-purple-800/40 space-y-2 text-left">
                    <div class="flex justify-between items-center text-xs text-purple-300">
                        <span>최종 점수</span>
                        <span id="finalScore" class="arcade-font text-base font-bold text-white">0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-purple-300">
                        <span>최대 콤보</span>
                        <span id="finalCombo" class="arcade-font text-sm font-bold text-pink-300">x0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs text-purple-300 border-t border-purple-800/50 pt-1.5">
                        <span>최고 기록</span>
                        <span id="bestScore" class="arcade-font text-base font-bold text-amber-300 neon-glow-gold">0</span>
                    </div>
                </div>

                <div class="pt-3">
                    <button id="playAgainBtn" class="btn-arcade w-full py-4 rounded-xl arcade-font text-sm font-black tracking-wider text-white shadow-lg">
                        다시 도전하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 100% 셀프 컨테인드 신스 사운드 시스템 (외부 오디오 파일 없음)
         */
        class GalacticSoundEngine {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.bgmTimer = null;
                this.bgmIndex = 0;
                this.filterNode = null;
                this.masterGain = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    
                    // 글로벌 로우패스 필터 (시간 왜곡 시 테이프 정지 / 앙상블 필터 적용)
                    this.filterNode = this.ctx.createBiquadFilter();
                    this.filterNode.type = 'lowpass';
                    this.filterNode.frequency.setValueAtTime(20000, this.ctx.currentTime);

                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.setValueAtTime(0.7, this.ctx.currentTime);

                    this.filterNode.connect(this.masterGain);
                    this.masterGain.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            setMute(mute) {
                this.isMuted = mute;
                if (this.masterGain && this.ctx) {
                    this.masterGain.gain.setValueAtTime(mute ? 0 : 0.7, this.ctx.currentTime);
                }
            }

            // 패들 충돌 핑 사운드 (금속성 청량한 고음 핑)
            playPaddleHit() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                osc.connect(gain);
                gain.connect(this.filterNode);

                osc.start(now);
                osc.stop(now + 0.18);
            }

            // 벽돌 파괴 (디지털 유리 파편 폭발음)
            playBrickShatter(pitchFactor = 1.0) {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;

                // 톤 진동
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                osc.type = 'sawtooth';
                const baseFreq = 400 * pitchFactor;
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.3, now + 0.15);

                oscGain.gain.setValueAtTime(0.35, now);
                oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                osc.connect(oscGain);
                oscGain.connect(this.filterNode);
                osc.start(now);
                osc.stop(now + 0.15);

                // 노이즈 파열음 합성 (유리 바삭거림)
                const bufferSize = this.ctx.sampleRate * 0.1;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.setValueAtTime(1200, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.3, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(this.filterNode);

                noise.start(now);
                noise.stop(now + 0.12);
            }

            // 벽 튕김 사운드 (서브 베이스 툭)
            playWallBounce() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(190, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                osc.connect(gain);
                gain.connect(this.filterNode);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            // 파워업 획득 사운드 (상승하는 크리스탈 아르페지오 차임)
            playPowerup() {
                if (this.isMuted || !this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.055;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                    osc.connect(gain);
                    gain.connect(this.filterNode);
                    osc.start(now);
                    osc.stop(now + 0.22);
                });
            }

            // 시간 왜곡 (테이프 스톱 및 로우패스 스윕)
            playTimeWarp() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                
                // 로우패스 필터 차단 주파수 급락 (앙상블 먹먹한 효과)
                this.filterNode.frequency.cancelScheduledValues(now);
                this.filterNode.frequency.setValueAtTime(20000, now);
                this.filterNode.frequency.exponentialRampToValueAtTime(650, now + 0.35);

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.45);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc.connect(gain);
                gain.connect(this.filterNode);
                osc.start(now);
                osc.stop(now + 0.45);
            }

            // 시간 왜곡 복구
            restoreFilter() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                this.filterNode.frequency.cancelScheduledValues(now);
                this.filterNode.frequency.exponentialRampToValueAtTime(20000, now + 0.4);
            }

            // 승리 팡파르
            playVictory() {
                if (this.isMuted || !this.ctx) return;
                const fanfareNotes = [440, 554, 659, 880, 1108];
                fanfareNotes.forEach((freq, i) => {
                    const now = this.ctx.currentTime + i * 0.12;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                    osc.connect(gain);
                    gain.connect(this.filterNode);
                    osc.start(now);
                    osc.stop(now + 0.4);
                });
            }

            // 게임 오버 디센딩 사운드
            playGameOver() {
                if (this.isMuted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

                osc.connect(gain);
                gain.connect(this.filterNode);
                osc.start(now);
                osc.stop(now + 0.85);
            }

            // 드라이빙 신스웨이브 베이스라인 BGM 루프
            startBGM() {
                if (this.bgmTimer) return;
                const bassline = [110, 110, 130.81, 110, 146.83, 110, 98, 123.47];
                const leadLine = [440, 0, 523.25, 0, 587.33, 523.25, 392, 440];
                const stepDuration = 0.18;

                const step = () => {
                    if (this.ctx && !this.isMuted && this.ctx.state === 'running') {
                        const now = this.ctx.currentTime;
                        const freq = bassline[this.bgmIndex % bassline.length];
                        const leadFreq = leadLine[this.bgmIndex % leadLine.length];

                        // 아웃런 베이스 신스
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now);

                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + stepDuration * 0.95);

                        osc.connect(gain);
                        gain.connect(this.filterNode);
                        osc.start(now);
                        osc.stop(now + stepDuration);

                        // 리드 신스 아르페지오 (비트마다 몽환적 서포트)
                        if (leadFreq > 0) {
                            const leadOsc = this.ctx.createOscillator();
                            const leadGain = this.ctx.createGain();
                            leadOsc.type = 'sine';
                            leadOsc.frequency.setValueAtTime(leadFreq, now);

                            leadGain.gain.setValueAtTime(0.06, now);
                            leadGain.gain.exponentialRampToValueAtTime(0.001, now + stepDuration * 1.4);

                            leadOsc.connect(leadGain);
                            leadGain.connect(this.filterNode);
                            leadOsc.start(now);
                            leadOsc.stop(now + stepDuration * 1.5);
                        }

                        this.bgmIndex++;
                    }
                    this.bgmTimer = setTimeout(step, stepDuration * 1000);
                };

                step();
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearTimeout(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }
        }

        // 오디오 인스턴스 생성
        const sound = new GalacticSoundEngine();
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('gameWrapper') || document.getElementById('game-wrapper');

        // 반응형 내부 가상 해상도 (세로 9:16 최적화)
        const GAME_WIDTH = 480;
        const GAME_HEIGHT = 854;

        // 게임 상태 머신
        const STATE = {
            START: 'START',
            PLAYING: 'PLAYING',
            PAUSED: 'PAUSED',
            GAMEOVER: 'GAMEOVER',
            VICTORY: 'VICTORY'
        };

        let gameState = STATE.START;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let lives = 3;
        let highScore = parseInt(localStorage.getItem('sparkanoid_high_score') || '0', 10);

        // 햅틱 진동 피드백 유틸리티
        function triggerHaptic(pattern) {
            if (typeof navigator !== 'undefined' && navigator.vibrate) {
                try {
                    navigator.vibrate(pattern);
                } catch (e) {
                    // 브라우저 권한 미허용 시 조용히 무시
                }
            }
        }

        // 파워업 타이머 상태
        const activeBuffs = {
            expand: 0,      // 잔여 시간 (ms)
            timeWarp: 0     // 잔여 시간 (ms)
        };

        // 색상 팔레트 상수 (촉촉한 형광 네온 계열)
        const BRICK_PALETTES = [
            { main: '#f43f5e', glow: '#fda4af', name: 'HOT_PINK' },     // 로우 1
            { main: '#f97316', glow: '#fed7aa', name: 'SOLAR_ORANGE' }, // 로우 2
            { main: '#eab308', glow: '#fef08a', name: 'LEMON_YELLOW' }, // 로우 3
            { main: '#10b981', glow: '#a7f3d0', name: 'TOXIC_GREEN' },  // 로우 4
            { main: '#06b6d4', glow: '#a5f3fc', name: 'ELECTRIC_BLUE' } // 로우 5
        ];

        const stars = [];
        for (let i = 0; i < 110; i++) {
            stars.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                size: Math.random() * 2 + 0.6,
                baseAlpha: Math.random() * 0.7 + 0.3,
                twinkleSpeed: Math.random() * 0.05 + 0.015,
                color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#93c5fd' : '#f472b6'),
                speed: Math.random() * 0.3 + 0.1
            });
        }

        // 배경 회전 고리 행성 데이터
        const planet = {
            x: GAME_WIDTH * 0.82,
            y: GAME_HEIGHT * 0.22,
            radius: 46,
            ringAngle: -0.42,
            rotation: 0
        };

        // 패들 객체
        const paddle = {
            x: GAME_WIDTH / 2,
            y: GAME_HEIGHT - 100,
            baseWidth: 92,
            width: 92,
            height: 18,
            targetX: GAME_WIDTH / 2,
            glowTimer: 0,
            thrusterFlicker: 0,

            update(delta) {
                // 부드러운 패들 추종 (보간 이동)
                this.x += (this.targetX - this.x) * 0.38;
                
                // 화면 경계 제한
                const halfW = this.width / 2;
                if (this.x - halfW < 10) this.x = 10 + halfW;
                if (this.x + halfW > GAME_WIDTH - 10) this.x = GAME_WIDTH - 10 - halfW;

                // 확장 파워업 반영
                const targetWidth = activeBuffs.expand > 0 ? this.baseWidth * 1.55 : this.baseWidth;
                this.width += (targetWidth - this.width) * 0.15;
                this.thrusterFlicker += 0.3;
            },

            draw(ctx) {
                const halfW = this.width / 2;
                const halfH = this.height / 2;

                ctx.save();
                ctx.translate(this.x, this.y);

                // 1. 하단 푸른 엔진 배기 플라즈마 화염
                const flameHeight = 12 + Math.sin(this.thrusterFlicker) * 5;
                const flameGrad = ctx.createLinearGradient(0, halfH, 0, halfH + flameHeight);
                flameGrad.addColorStop(0, 'rgba(6, 182, 212, 0.9)');
                flameGrad.addColorStop(0.5, 'rgba(59, 130, 246, 0.6)');
                flameGrad.addColorStop(1, 'rgba(147, 51, 234, 0)');

                ctx.fillStyle = flameGrad;
                ctx.beginPath();
                ctx.moveTo(-halfW * 0.6, halfH - 2);
                ctx.lineTo(0, halfH + flameHeight);
                ctx.lineTo(halfW * 0.6, halfH - 2);
                ctx.closePath();
                ctx.fill();

                // 2. 미래지향적 메탈릭 캡슐 바디
                const bodyGrad = ctx.createLinearGradient(0, -halfH, 0, halfH);
                bodyGrad.addColorStop(0, '#e0e7ff');
                bodyGrad.addColorStop(0.3, '#818cf8');
                bodyGrad.addColorStop(0.7, '#3730a3');
                bodyGrad.addColorStop(1, '#1e1b4b');

                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 18;
                ctx.fillStyle = bodyGrad;

                // 둥근 캡슐 형태
                ctx.beginPath();
                ctx.roundRect(-halfW, -halfH, this.width, this.height, 10);
                ctx.fill();

                // 상단 메탈 하이라이트 광택선
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-halfW + 6, -halfH + 2, this.width - 12, 3, 2);
                ctx.stroke();

                // 중앙 코어 네온 센서
                ctx.fillStyle = activeBuffs.expand > 0 ? '#ec4899' : '#38bdf8';
                ctx.shadowColor = activeBuffs.expand > 0 ? '#f43f5e' : '#06b6d4';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.ellipse(0, 0, 14, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        // 볼 클래스 (멀티볼 및 궤적 리본 지원)
        class Ball {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.radius = 7.5;
                this.speed = 7.2;
                this.vx = vx || 0;
                this.vy = vy || -this.speed;
                this.trail = []; // 혜성 꼬리 버퍼
                this.maxTrail = 10;
            }

            update() {
                // 시간 왜곡 버프 시 속도 50% 감속
                const timeFactor = activeBuffs.timeWarp > 0 ? 0.5 : 1.0;
                
                // 리본 꼬리 좌표 기록
                this.trail.unshift({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrail) {
                    this.trail.pop();
                }

                this.x += this.vx * timeFactor;
                this.y += this.vy * timeFactor;

                // 좌우 벽 충돌
                if (this.x - this.radius <= 10) {
                    this.x = 10 + this.radius;
                    this.vx = Math.abs(this.vx);
                    sound.playWallBounce();
                } else if (this.x + this.radius >= GAME_WIDTH - 10) {
                    this.x = GAME_WIDTH - 10 - this.radius;
                    this.vx = -Math.abs(this.vx);
                    sound.playWallBounce();
                }

                // 상단 천장 충돌
                if (this.y - this.radius <= 35) {
                    this.y = 35 + this.radius;
                    this.vy = Math.abs(this.vy);
                    sound.playWallBounce();
                }
            }

            draw(ctx) {
                // 1. 혜성 리본 꼬리 렌더링
                if (this.trail.length > 1) {
                    for (let i = 0; i < this.trail.length - 1; i++) {
                        const pt1 = this.trail[i];
                        const pt2 = this.trail[i + 1];
                        const alpha = (1 - (i / this.trail.length)) * 0.65;
                        const width = this.radius * 2 * (1 - (i / this.trail.length) * 0.7);

                        ctx.strokeStyle = activeBuffs.timeWarp > 0 ? `rgba(56, 189, 248, ${alpha})` : `rgba(244, 63, 94, ${alpha})`;
                        ctx.lineWidth = width;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(pt1.x, pt1.y);
                        ctx.lineTo(pt2.x, pt2.y);
                        ctx.stroke();
                    }
                }

                // 2. 고에너지 플라즈마 코어 볼 렌더링
                ctx.save();
                ctx.shadowColor = activeBuffs.timeWarp > 0 ? '#38bdf8' : '#fb7185';
                ctx.shadowBlur = 16;
                
                const grad = ctx.createRadialGradient(this.x - 2, this.y - 2, 1, this.x, this.y, this.radius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, activeBuffs.timeWarp > 0 ? '#7dd3fc' : '#fda4af');
                grad.addColorStop(1, activeBuffs.timeWarp > 0 ? '#0284c7' : '#e11d48');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let balls = [];

        // 벽돌 클래스
        class Brick {
            constructor(x, y, width, height, paletteIndex, hp = 1) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.palette = BRICK_PALETTES[paletteIndex % BRICK_PALETTES.length];
                this.hp = hp;
                this.maxHp = hp;
                this.alive = true;
            }

            draw(ctx) {
                if (!this.alive) return;

                ctx.save();
                ctx.shadowColor = this.palette.main;
                ctx.shadowBlur = 12;

                // 둥근 3D 블록 그라데이션
                const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
                grad.addColorStop(0, this.palette.glow);
                grad.addColorStop(0.3, this.palette.main);
                grad.addColorStop(1, '#0f051d');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();

                // 세련된 테두리 및 상단 베벨 하이라이트
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // 상단 입체 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fillRect(this.x + 4, this.y + 2, this.width - 8, 2);

                ctx.restore();
            }
        }

        let bricks = [];

        // 파편 파티클 풀
        const particles = [];
        function createExplosion(x, y, color) {
            const count = 18; // 모바일 60FPS 최적화를 위해 입자 수 제한
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    size: Math.random() * 3.5 + 1.5,
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // 플로팅 콤보 팝업 텍스트 풀
        const floatingTexts = [];
        function addFloatingText(text, x, y, color) {
            floatingTexts.push({
                text,
                x,
                y,
                color,
                life: 1.0,
                vy: -1.8
            });
        }

        // 파워업 아이템
        const POWERUP_TYPES = {
            EXPAND: { name: '확장', icon: '↔', color: '#ec4899', duration: 10000 },
            MULTIBALL: { name: '멀티볼', icon: '✦', color: '#06b6d4', duration: 0 },
            TIMEWARP: { name: '시간왜곡', icon: '⏳', color: '#a855f7', duration: 5000 }
        };

        class PowerupCapsule {
            constructor(x, y, typeKey) {
                this.x = x;
                this.y = y;
                this.typeKey = typeKey;
                this.type = POWERUP_TYPES[typeKey];
                this.width = 30;
                this.height = 16;
                this.vy = 2.2;
                this.rotation = 0;
            }

            update() {
                this.y += this.vy;
                this.rotation += 0.04;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.shadowColor = this.type.color;
                ctx.shadowBlur = 14;

                ctx.fillStyle = this.type.color;
                ctx.beginPath();
                ctx.roundRect(-this.width / 2, -this.height / 2, this.width, this.height, 8);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 0;
                ctx.fillText(this.type.icon, 0, 1);

                ctx.restore();
            }
        }

        let powerups = [];

        function initBricks() {
            bricks = [];
            const rows = 6;
            const cols = 7;
            const brickWidth = 56;
            const brickHeight = 22;
            const padding = 7;
            const offsetTop = 95;
            const offsetLeft = (GAME_WIDTH - (cols * brickWidth + (cols - 1) * padding)) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = offsetLeft + c * (brickWidth + padding);
                    const y = offsetTop + r * (brickHeight + padding);
                    bricks.push(new Brick(x, y, brickWidth, brickHeight, r));
                }
            }
        }

        function resetRound(keepBricks = false) {
            paddle.x = GAME_WIDTH / 2;
            paddle.targetX = GAME_WIDTH / 2;
            paddle.width = paddle.baseWidth;

            balls = [new Ball(paddle.x, paddle.y - 18, 2.5, -6.8)];
            powerups = [];
            combo = 0;
            updateComboUI();

            activeBuffs.expand = 0;
            activeBuffs.timeWarp = 0;
            sound.restoreFilter();
            document.getElementById('timeWarpEffect').classList.remove('time-warp-active');

            if (!keepBricks) {
                initBricks();
            }
            updatePowerupBars();
        }

        function dropPowerupMaybe(x, y) {
            // 약 24% 확률로 파워업 드롭
            if (Math.random() < 0.24) {
                const keys = Object.keys(POWERUP_TYPES);
                const chosenKey = keys[Math.floor(Math.random() * keys.length)];
                powerups.push(new PowerupCapsule(x, y, chosenKey));
            }
        }

        function applyPowerup(typeKey) {
            sound.playPowerup();
            triggerHaptic([30, 40, 50]);

            if (typeKey === 'EXPAND') {
                activeBuffs.expand = POWERUP_TYPES.EXPAND.duration;
                addFloatingText('PADDLE EXPAND!', paddle.x, paddle.y - 30, '#ec4899');
            } else if (typeKey === 'MULTIBALL') {
                // 현재 존재하는 공을 기준으로 2개의 추가 공 복제 생성 (총 3구 이상)
                const currentBall = balls[0] || { x: paddle.x, y: paddle.y - 20, speed: 7 };
                balls.push(new Ball(currentBall.x, currentBall.y, -4.5, -5.5));
                balls.push(new Ball(currentBall.x, currentBall.y, 4.5, -5.5));
                addFloatingText('MULTI-BALL x3!', paddle.x, paddle.y - 30, '#06b6d4');
            } else if (typeKey === 'TIMEWARP') {
                activeBuffs.timeWarp = POWERUP_TYPES.TIMEWARP.duration;
                sound.playTimeWarp();
                document.getElementById('timeWarpEffect').classList.add('time-warp-active');
                addFloatingText('TIME WARP 50% SLOW!', paddle.x, paddle.y - 30, '#a855f7');
            }

            updatePowerupBars();
        }

        function updateScore(deltaPoints) {
            score += deltaPoints;
            const scoreStr = score.toString().padStart(6, '0');
            document.getElementById('scoreDisplay').innerText = scoreStr;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('sparkanoid_high_score', highScore.toString());
            }
        }

        function updateComboUI() {
            const container = document.getElementById('comboContainer');
            const display = document.getElementById('comboDisplay');
            if (combo >= 2) {
                container.style.opacity = '1';
                display.innerText = `x${combo}`;
            } else {
                container.style.opacity = '0';
            }
        }

        function updateLivesUI() {
            const container = document.getElementById('livesContainer');
            container.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.innerHTML = '▲';
                heart.className = i < lives ? 'text-cyan-400 drop-shadow-[0_0_6px_#06b6d4]' : 'text-purple-950/70';
                container.appendChild(heart);
            }
        }

        function updatePowerupBars() {
            const container = document.getElementById('powerupBarContainer');
            container.innerHTML = '';

            if (activeBuffs.expand > 0) {
                const pct = (activeBuffs.expand / POWERUP_TYPES.EXPAND.duration) * 100;
                container.appendChild(createBarElement('패들 확장', pct, '#ec4899'));
            }
            if (activeBuffs.timeWarp > 0) {
                const pct = (activeBuffs.timeWarp / POWERUP_TYPES.TIMEWARP.duration) * 100;
                container.appendChild(createBarElement('시간 왜곡', pct, '#a855f7'));
            }
        }

        function createBarElement(label, pct, color) {
            const row = document.createElement('div');
            row.className = 'hud-glass px-2.5 py-1 rounded-lg flex items-center gap-2 max-w-[160px]';
            row.innerHTML = `
                <span class="text-[10px] font-bold text-white whitespace-nowrap">${label}</span>
                <div class="w-full bg-purple-950/80 h-1.5 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-75" style="width: ${pct}%; background-color: ${color}; box-shadow: 0 0 6px ${color}"></div>
                </div>
            `;
            return row;
        }

        function checkCollisions(delta) {
            // 1. 공 & 패들 충돌
            balls.forEach(ball => {
                const halfW = paddle.width / 2;
                const halfH = paddle.height / 2;

                if (
                    ball.y + ball.radius >= paddle.y - halfH &&
                    ball.y - ball.radius <= paddle.y + halfH &&
                    ball.x >= paddle.x - halfW &&
                    ball.x <= paddle.x + halfW &&
                    ball.vy > 0
                ) {
                    // 패들 중심으로부터의 거리에 따른 반사각 계산
                    const hitOffset = (ball.x - paddle.x) / halfW; // -1.0 ~ 1.0
                    const maxAngle = (75 * Math.PI) / 180; // 최대 75도
                    const bounceAngle = hitOffset * maxAngle;

                    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    ball.vx = speed * Math.sin(bounceAngle);
                    ball.vy = -Math.abs(speed * Math.cos(bounceAngle));
                    ball.y = paddle.y - halfH - ball.radius;

                    combo = 0; // 패들에 닿으면 콤보 리셋
                    updateComboUI();

                    sound.playPaddleHit();
                    triggerHaptic([15]);

                    // 패들 접촉 스파크 효과
                    createExplosion(ball.x, ball.y, '#06b6d4');
                }
            });

            // 2. 공 & 벽돌 충돌
            balls.forEach(ball => {
                bricks.forEach(brick => {
                    if (!brick.alive) return;

                    // 충돌 박스 검사
                    if (
                        ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height
                    ) {
                        brick.alive = false;

                        // 충돌 면 판별 (상하 vs 좌우)
                        const prevX = ball.x - ball.vx;
                        const prevY = ball.y - ball.vy;

                        if (prevX <= brick.x || prevX >= brick.x + brick.width) {
                            ball.vx = -ball.vx;
                        } else {
                            ball.vy = -ball.vy;
                        }

                        // 콤보 증가 및 점수 가산
                        combo++;
                        if (combo > maxCombo) maxCombo = combo;
                        updateComboUI();

                        const baseScore = 100;
                        const earned = baseScore * combo;
                        updateScore(earned);

                        sound.playBrickShatter(1.0 + combo * 0.08);
                        triggerHaptic([25, 30, 25]);

                        createExplosion(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.palette.main);

                        if (combo >= 3) {
                            addFloatingText(`${combo}x COMBO!`, brick.x + brick.width / 2, brick.y, brick.palette.glow);
                        }

                        // 파워업 드롭 시도
                        dropPowerupMaybe(brick.x + brick.width / 2, brick.y + brick.height / 2);
                    }
                });
            });

            // 3. 파워업 캡슐 & 패들 수집 충돌
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.update();

                const halfW = paddle.width / 2;
                const halfH = paddle.height / 2;
                if (
                    p.y + p.height / 2 >= paddle.y - halfH &&
                    p.y - p.height / 2 <= paddle.y + halfH &&
                    p.x >= paddle.x - halfW &&
                    p.x <= paddle.x + halfW
                ) {
                    applyPowerup(p.typeKey);
                    powerups.splice(i, 1);
                    continue;
                }

                // 바닥으로 떨어진 파워업 제거
                if (p.y > GAME_HEIGHT + 20) {
                    powerups.splice(i, 1);
                }
            }

            // 4. 낙하한 공 검사
            for (let i = balls.length - 1; i >= 0; i--) {
                if (balls[i].y - balls[i].radius > GAME_HEIGHT) {
                    balls.splice(i, 1);
                }
            }

            // 모든 공 소진 시 생명 차감
            if (balls.length === 0) {
                lives--;
                updateLivesUI();
                combo = 0;
                updateComboUI();

                if (lives > 0) {
                    sound.playWallBounce();
                    resetRound(true);
                    gameState = STATE.START;
                    document.getElementById('startOverlay').classList.remove('hidden');
                } else {
                    // 게임 오버
                    handleGameOver();
                }
            }

            // 모든 벽돌 클리어 확인 (승리)
            const remainingBricks = bricks.filter(b => b.alive).length;
            if (remainingBricks === 0) {
                handleVictory();
            }
        }

        function renderBackground(ctx) {
            // 은하계 딥 그라데이션
            const bgGrad = ctx.createRadialGradient(
                GAME_WIDTH / 2, GAME_HEIGHT * 0.35, 20,
                GAME_WIDTH / 2, GAME_HEIGHT / 2, GAME_HEIGHT * 0.7
            );
            bgGrad.addColorStop(0, '#1a0b36');
            bgGrad.addColorStop(0.5, '#0d0722');
            bgGrad.addColorStop(1, '#05030e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // 반짝이는 별무리 (패럴랙스 이동)
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > GAME_HEIGHT) {
                    star.y = 0;
                    star.x = Math.random() * GAME_WIDTH;
                }
                const alpha = star.baseAlpha + Math.sin(Date.now() * star.twinkleSpeed) * 0.25;
                ctx.fillStyle = star.color;
                ctx.globalAlpha = Math.max(0.15, Math.min(1, alpha));
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 멀리 회전하는 고리 행성 메시 렌더링
            planet.rotation += 0.003;
            ctx.save();
            ctx.translate(planet.x, planet.y);

            // 행성 본체
            const planetGrad = ctx.createRadialGradient(-12, -12, 4, 0, 0, planet.radius);
            planetGrad.addColorStop(0, '#8b5cf6');
            planetGrad.addColorStop(0.5, '#4c1d95');
            planetGrad.addColorStop(1, '#1e1035');

            ctx.shadowColor = '#a855f7';
            ctx.shadowBlur = 24;
            ctx.fillStyle = planetGrad;
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // 행성 대기선 밴드
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(196, 181, 253, 0.2)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius - 2, 0, Math.PI * 2);
            ctx.stroke();

            // 신비로운 가스 행성 고리 (링 시스템)
            ctx.rotate(planet.ringAngle + Math.sin(planet.rotation) * 0.05);
            ctx.beginPath();
            ctx.ellipse(0, 0, planet.radius * 2.1, planet.radius * 0.52, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(216, 180, 254, 0.45)';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, planet.radius * 2.3, planet.radius * 0.58, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(167, 139, 250, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        let lastTime = performance.now();

        function gameLoop(currentTime) {
            const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            // 1. 버프 잔여 시간 갱신
            if (gameState === STATE.PLAYING) {
                if (activeBuffs.expand > 0) {
                    activeBuffs.expand -= delta * 1000;
                    if (activeBuffs.expand <= 0) activeBuffs.expand = 0;
                }
                if (activeBuffs.timeWarp > 0) {
                    activeBuffs.timeWarp -= delta * 1000;
                    if (activeBuffs.timeWarp <= 0) {
                        activeBuffs.timeWarp = 0;
                        sound.restoreFilter();
                        document.getElementById('timeWarpEffect').classList.remove('time-warp-active');
                    }
                }
                updatePowerupBars();
            }

            // 2. 업데이트
            if (gameState === STATE.PLAYING) {
                paddle.update(delta);
                balls.forEach(b => b.update());
                checkCollisions(delta);
            }

            // 3. 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 4. 플로팅 텍스트 업데이트
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.life -= 0.025;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // 5. 렌더링
            renderBackground(ctx);

            // 벽돌
            bricks.forEach(b => b.draw(ctx));

            // 파워업 아이템
            powerups.forEach(p => p.draw(ctx));

            // 패들 & 공
            paddle.draw(ctx);
            balls.forEach(b => b.draw(ctx));

            // 파티클
            particles.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 플로팅 콤보 텍스트 렌더링
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.font = 'bold 16px "Orbitron", sans-serif';
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = 10;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            requestAnimationFrame(gameLoop);
        }

        function handleGameOver() {
            gameState = STATE.GAMEOVER;
            sound.playGameOver();
            triggerHaptic([100, 80, 150]);

            document.getElementById('resultBadge').innerText = 'MISSION TERMINATED';
            document.getElementById('resultBadge').className = 'text-xs font-bold uppercase tracking-widest text-rose-400';
            document.getElementById('resultTitle').innerText = 'GAME OVER';
            document.getElementById('resultTitle').className = 'arcade-font text-3xl font-black tracking-wider text-rose-400 neon-glow-pink';

            showResultModal();
        }

        function handleVictory() {
            gameState = STATE.VICTORY;
            sound.playVictory();
            triggerHaptic([60, 40, 60, 40, 120]);

            // 승리 보너스 점수
            updateScore(5000);

            document.getElementById('resultBadge').innerText = 'SYSTEM PURIFIED';
            document.getElementById('resultBadge').className = 'text-xs font-bold uppercase tracking-widest text-cyan-300';
            document.getElementById('resultTitle').innerText = 'VICTORY!';
            document.getElementById('resultTitle').className = 'arcade-font text-3xl font-black tracking-wider text-cyan-300 neon-glow-cyan';

            showResultModal();
        }

        function showResultModal() {
            document.getElementById('finalScore').innerText = score.toLocaleString();
            document.getElementById('finalCombo').innerText = `x${maxCombo}`;
            document.getElementById('bestScore').innerText = highScore.toLocaleString();

            const resultOverlay = document.getElementById('resultOverlay');
            resultOverlay.classList.remove('hidden');
            resultOverlay.classList.add('flex');
        }

        function restartGame() {
            score = 0;
            combo = 0;
            maxCombo = 0;
            lives = 3;
            document.getElementById('scoreDisplay').innerText = '000000';
            updateLivesUI();
            resetRound(false);

            document.getElementById('resultOverlay').classList.add('hidden');
            document.getElementById('resultOverlay').classList.remove('flex');
            document.getElementById('pauseOverlay').classList.add('hidden');
            document.getElementById('pauseOverlay').classList.remove('flex');

            gameState = STATE.PLAYING;
        }

        function setupControls() {
            // 반응형 캔버스 크기 계산 및 맞춤
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = GAME_WIDTH;
                canvas.height = GAME_HEIGHT;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // 터치/마우스 위치를 가상 좌표로 변환하는 함수
            function handlePointerMove(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = GAME_WIDTH / rect.width;
                const scaleY = GAME_HEIGHT / rect.height;

                const localY = (clientY - rect.top) * scaleY;
                const localX = (clientX - rect.left) * scaleX;

                // 하단 30% 영역 또는 플레이 상태일 때 즉각 패들 목표 위치 매핑
                if (gameState === STATE.PLAYING) {
                    paddle.targetX = localX;
                }
            }

            // 터치 이벤트 리스너 (1:1 반응 슬라이드)
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    handlePointerMove(touch.clientX, touch.clientY);
                }
            }, { passive: false });

            window.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    handlePointerMove(touch.clientX, touch.clientY);
                }
            }, { passive: true });

            // 데스크톱 마우스 이동 지원
            window.addEventListener('mousemove', (e) => {
                handlePointerMove(e.clientX, e.clientY);
            });

            // "탭하여 시작" 오버레이 터치 핸들러
            const startOverlay = document.getElementById('startOverlay');
            startOverlay.addEventListener('click', () => {
                sound.init();
                sound.startBGM();
                startOverlay.classList.add('hidden');
                gameState = STATE.PLAYING;
                triggerHaptic([20]);
            });

            // 일시정지 모달 조작
            const pauseBtn = document.getElementById('pauseBtn');
            const pauseOverlay = document.getElementById('pauseOverlay');
            const resumeBtn = document.getElementById('resumeBtn');
            const restartFromPauseBtn = document.getElementById('restartFromPauseBtn');

            pauseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (gameState === STATE.PLAYING) {
                    gameState = STATE.PAUSED;
                    pauseOverlay.classList.remove('hidden');
                    pauseOverlay.classList.add('flex');
                }
            });

            resumeBtn.addEventListener('click', () => {
                pauseOverlay.classList.add('hidden');
                pauseOverlay.classList.remove('flex');
                gameState = STATE.PLAYING;
            });

            restartFromPauseBtn.addEventListener('click', () => {
                restartGame();
            });

            // 결과 모달 "다시 도전하기"
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                restartGame();
            });

            // 오디오 온/오프 토글
            const audioToggleBtn = document.getElementById('audioToggleBtn');
            const audioIconOn = document.getElementById('audioIconOn');
            const audioIconOff = document.getElementById('audioIconOff');
            let isMuted = false;

            audioToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sound.init();
                isMuted = !isMuted;
                sound.setMute(isMuted);

                if (isMuted) {
                    audioIconOn.classList.add('hidden');
                    audioIconOff.classList.remove('hidden');
                } else {
                    audioIconOn.classList.remove('hidden');
                    audioIconOff.classList.add('hidden');
                }
            });
        }

        window.onload = function () {
            initBricks();
            updateLivesUI();
            updateScore(0);
            setupControls();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
